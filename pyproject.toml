[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "birdepy"
# Replaced by semantic-release-pypi in the release workspace before building.
version = "0.0.0"
description = "Parameter estimation for birth-and-death processes"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Sophie Hautphenne and Brendan Patch", email = "birdepy@gmail.com"}]
keywords = ["Markov chain", "stochastic", "population process"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "numpy>=1.26.4",
    "mpmath>=1.4.1",
    "scipy>=1.15.3",
    "matplotlib>=3.10.9",
    "gwr-inversion>=1.2.0",
    "numba>=0.68.0",
]

[project.urls]
Homepage = "https://birdepy.github.io"
"Bug Reports" = "https://github.com/birdepy/birdepy_project/issues"
Source = "https://github.com/birdepy/birdepy_project"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
birdepy = ["data_files/iltcme.json"]
