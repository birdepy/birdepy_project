name: test

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  baseline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements.dev.txt
      - run: python -m pip check
      - run: python -m pytest

  installed-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
      - run: python -m pip install --upgrade pip build
      # Build a wheel from the sdist, then test outside the checkout so pytest.ini
      # cannot put src/ on the import path and conceal packaging defects.
      - run: python -m build
      - run: python -m pip install dist/*.whl -r requirements.dev.txt
      - run: python -m pip check
      - name: Test installed distribution
        run: |
          mkdir -p "$RUNNER_TEMP/installed-tests"
          cp tests/*_test.py "$RUNNER_TEMP/installed-tests/"
          cd "$RUNNER_TEMP/installed-tests"
          python -c "import birdepy; print(birdepy.__file__)"
          python -m pytest

  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
      - run: python -m pip install build setuptools wheel twine tomlkit
      - run: npm ci
      - run: npm run check:release

  # Branch protection requires this stable name, regardless of matrix sizes.
  test:
    if: always()
    needs: [baseline, installed-package, release-tooling]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
